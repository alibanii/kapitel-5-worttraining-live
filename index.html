<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#58cc02">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Aspekte B2">
  <title>Aspekte B2 · Vokabeln</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="home">

  <!-- ============ TOP HUD (home + words views) ============ -->
  <header id="hud" class="hud">
    <div class="hud-inner">
      <button id="hudStreak" class="hud-chip" type="button" title="Day streak">
        <span class="chip-ico">🔥</span><strong id="streakCount">0</strong>
      </button>
      <button id="hudGoal" class="hud-chip goal" type="button" title="Daily goal">
        <svg class="goal-ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="goal-track" cx="18" cy="18" r="15.5"></circle>
          <circle id="goalArc" class="goal-arc" cx="18" cy="18" r="15.5"></circle>
        </svg>
        <span class="chip-ico goal-bolt">⚡</span>
        <strong id="goalText">0/20</strong>
      </button>
      <button id="hudHearts" class="hud-chip" type="button" title="Hearts">
        <span class="chip-ico">❤️</span><strong id="heartCount">5</strong>
      </button>
      <button id="openSettings" class="hud-icon" type="button" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <!-- ============ HOME / LEARNING PATH ============ -->
  <main id="home" class="screen" aria-label="Learning path">
    <nav id="chapterTabs" class="chapter-tabs" aria-label="Chapters"></nav>
    <section class="chapter-hero" id="chapterHero">
      <div class="hero-crest" id="heroCrest">1</div>
      <div class="hero-text">
        <p class="eyebrow">Kapitel <span id="heroNumber">1</span></p>
        <h1 id="heroTitle">Neue Heimat</h1>
        <p id="heroSummary" class="hero-summary"></p>
      </div>
      <div class="hero-crowns" id="heroCrowns" title="Crowns earned">
        <span class="crown-ico">👑</span><strong id="heroCrownCount">0</strong>
      </div>
    </section>
    <div id="path" class="path" role="list"></div>
  </main>

  <!-- ============ SESSION RUNNER ============ -->
  <section id="session" class="screen session" aria-label="Exercise" hidden>
    <div class="session-top">
      <button id="quitSession" class="quit" type="button" aria-label="Quit session">✕</button>
      <div class="sbar" role="progressbar" aria-label="Session progress"><span id="sbarFill"></span></div>
      <div id="sessionHearts" class="session-hearts" aria-label="Hearts left">
        <span>❤️</span><strong>5</strong>
      </div>
    </div>
    <div class="session-body">
      <div id="stage" class="stage" aria-live="polite"></div>
    </div>
    <div id="feedbackSheet" class="feedback-sheet" aria-live="assertive"></div>
    <div class="session-foot">
      <button id="primaryBtn" class="btn-primary" type="button">Check</button>
    </div>
  </section>

  <!-- ============ WORDS / BANK ============ -->
  <main id="bank" class="screen" aria-label="Vocabulary list" hidden>
    <div class="bank-top">
      <h1 class="bank-title">Wörterbuch</h1>
      <p id="bankMeta" class="bank-meta"></p>
      <input id="searchInput" class="search" type="search" placeholder="Search German or English" aria-label="Search vocabulary">
      <div id="bankChips" class="bank-chips"></div>
    </div>
    <div id="wordList" class="word-list"></div>
  </main>

  <!-- ============ BOTTOM NAV ============ -->
  <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn active" data-nav="home" type="button"><span>🏠</span>Learn</button>
    <button class="nav-btn" data-nav="practice" type="button"><span>🏋️</span>Practice</button>
    <button class="nav-btn" data-nav="bank" type="button"><span>📖</span>Words</button>
    <button class="nav-btn" data-nav="settings" type="button"><span>⚙️</span>Profile</button>
  </nav>

  <!-- ============ SETTINGS MODAL ============ -->
  <div id="settingsModal" class="modal" hidden>
    <div class="modal-scrim" data-close-settings></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Settings">
      <div class="modal-head">
        <h2>Profile &amp; Settings</h2>
        <button class="modal-x" type="button" data-close-settings aria-label="Close">✕</button>
      </div>

      <div class="stat-grid" id="profileStats"></div>

      <div class="setting-block">
        <h3>Daily goal</h3>
        <div id="goalOptions" class="pill-row"></div>
      </div>

      <div class="setting-block">
        <h3>Sound &amp; speech</h3>
        <label class="switch-row">
          <span>Sound effects</span>
          <input id="soundToggle" type="checkbox" checked>
        </label>
        <label class="switch-row">
          <span>Auto-play new words</span>
          <input id="autoSpeak" type="checkbox" checked>
        </label>
        <label class="field">
          <span>Pronunciation speed</span>
          <select id="speechRate">
            <option value="0.7">Slow</option>
            <option value="0.85" selected>Normal</option>
            <option value="1">Fast</option>
          </select>
        </label>
        <label class="field">
          <span>German voice</span>
          <select id="voiceSelect"><option value="">Best available</option></select>
        </label>
        <p id="voiceStatus" class="voice-status"></p>
      </div>

      <div class="setting-block">
        <h3>Session</h3>
        <label class="switch-row">
          <span>Hearts mode <em>(lose the round at 0)</em></span>
          <input id="heartsToggle" type="checkbox" checked>
        </label>
      </div>

      <button id="resetProgress" class="btn-danger" type="button">Reset all progress</button>
      <p class="app-credit">Aspekte neu B2 · Kapitel 1–5 · offline word trainer</p>
    </div>
  </div>

  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
